name: Audit 712 Question Explanation Mapping

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/audit-712.yml'
      - 'site.zip'
      - 'upgrade6/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and export current 712 dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist audit712
          mkdir -p dist audit712
          unzip -q site.zip -d dist
          cat upgrade6/apply.part* > /tmp/apply_712.py
          python3 /tmp/apply_712.py dist upgrade6
          grep -q 'v1.65_FINAL_712' dist/DATASET_VERSION.txt
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('apply712','/tmp/apply_712.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          raw=b''.join(p.read_bytes() for p in sorted(Path('dist').glob('data.part*')))
          root,kind=mod.decode_data(raw)
          qs=mod.locate_questions(root)
          assert len(qs)==712
          assert [q.get('id') for q in qs]==[f'LEARN-COM-{i:03d}' for i in range(1,713)]
          required=('question','choiceA','choiceB','choiceC','choiceD','answer','explanation','optionExplanations','relatedKnowledge','keyPoints','mnemonic','sources')
          missing=[]
          for q in qs:
              for k in required:
                  if not str(q.get(k,'')).strip(): missing.append([q.get('id'),k])
          summary={
              'count':len(qs),
              'encoding':kind,
              'id_sequence_ok':True,
              'answers_A_D':sum(str(q.get('answer','')).strip().upper() in ('A','B','C','D') for q in qs),
              'missing_required_fields':missing,
              'optionExplanations_types':{}
          }
          for q in qs:
              t=type(q.get('optionExplanations')).__name__
              summary['optionExplanations_types'][t]=summary['optionExplanations_types'].get(t,0)+1
          Path('audit712/dataset712.json').write_text(json.dumps(qs,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('audit712/structural_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Upload audit dataset
        uses: actions/upload-artifact@v4
        with:
          name: audit-712-dataset
          path: audit712
          retention-days: 7
