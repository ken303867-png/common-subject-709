name: Predeploy QA v1.66 712

on:
  push:
    branches: ["v1.66-integration"]
    paths:
      - "upgrade7/**"
      - ".github/workflows/predeploy-v166.yml"
      - "site.zip"
      - "upgrade6/**"
      - "display-patch.js"
      - "display-patch.css"
      - "memory-mode-patch.py"
      - "memory-mode-ui.js"
      - "memory-mode.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct v1.65 public build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          unzip -q site.zip -d dist
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/sw.js

          cat upgrade6/apply.part* > /tmp/apply_712.py
          python3 /tmp/apply_712.py dist upgrade6
          grep -q 'v1.65_FINAL_712' dist/DATASET_VERSION.txt
          grep -q '712 questions' dist/DATASET_VERSION.txt

      - name: Apply v1.66 20-question correction patch
        shell: bash
        run: |
          set -euo pipefail
          python3 upgrade7/apply_v166.py dist upgrade7/v1.66_patch.json /tmp/apply_712.py
          grep -q 'v1.66_FINAL_712' dist/DATASET_VERSION.txt
          grep -q '712 questions' dist/DATASET_VERSION.txt
          grep -q 'changes=20' dist/DATASET_VERSION.txt
          grep -q 'answer_changes=0' dist/DATASET_VERSION.txt
          grep -q 'question_changes=0' dist/DATASET_VERSION.txt
          grep -q 'choice_changes=0' dist/DATASET_VERSION.txt
          grep -q 'canonical_sha256=c47fb62f5fe7c398099b237539bbafdfaea2ca035600e5f6760bcf8b9cd8cc73' dist/DATASET_VERSION.txt

      - name: Apply current UI patches without deploying
        shell: bash
        run: |
          set -euo pipefail
          cp display-patch.js dist/display-patch.js
          cp display-patch.css dist/display-patch.css
          cp memory-mode-ui.js dist/memory-mode-ui.js
          cp memory-mode.css dist/memory-mode.css

          sed -i "s/common_subject_709_pwa_v1/common_subject_712_pwa_v1/g" dist/display-patch.js
          python3 memory-mode-patch.py dist/app.js

          sed -i '/<\/head>/i\  <link rel="stylesheet" href="./display-patch.css?v=7">' dist/index.html
          sed -i '/<\/head>/i\  <link rel="stylesheet" href="./memory-mode.css?v=2">' dist/index.html
          sed -i '/<\/body>/i\  <script src="./display-patch.js?v=7"></script>' dist/index.html
          sed -i '/<\/body>/i\  <script src="./memory-mode-ui.js?v=2"></script>' dist/index.html

          sed -i "s/const CACHE='common-subject-709-v1-2';/const CACHE='common-subject-712-v1-66-memory-2';/" dist/sw.js
          sed -i "s#'./data.part04'#'./data.part04','./display-patch.js','./display-patch.css','./memory-mode-ui.js','./memory-mode.css'#" dist/sw.js

      - name: Full predeploy validation
        shell: bash
        run: |
          set -euo pipefail

          node --check dist/app.js
          node --check dist/display-patch.js
          node --check dist/memory-mode-ui.js
          node --check dist/sw.js

          grep -q '712問' dist/index.html
          grep -q 'MEMORY_MODE_PATCH_V1' dist/app.js
          grep -q 'common_subject_712_pwa_v1' dist/display-patch.js
          ! grep -q 'common_subject_709_pwa_v1' dist/display-patch.js
          grep -q 'common-subject-712-v1-66-memory-2' dist/sw.js
          grep -q "'./memory-mode-ui.js'" dist/sw.js
          grep -q "'./memory-mode.css'" dist/sw.js

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          q = json.loads(Path("dist/DATASET_712_V166_AUDIT.json").read_text(encoding="utf-8"))
          assert len(q) == 712
          assert [x["id"] for x in q] == [f"LEARN-COM-{i:03d}" for i in range(1,713)]
          assert all(x["answer"] in ("A","B","C","D") for x in q)
          assert all(x["question"].strip() for x in q)
          assert all(all(x[f"choice{k}"].strip() for k in "ABCD") for x in q)
          assert all(x["explanation"].strip() for x in q)
          assert all(x["optionExplanations"].strip() for x in q)

          raw = json.dumps(q, ensure_ascii=False, sort_keys=True, separators=(",",":")).encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == "c47fb62f5fe7c398099b237539bbafdfaea2ca035600e5f6760bcf8b9cd8cc73", digest

          q317 = q[316]
          assert q317["id"] == "LEARN-COM-317"
          assert q317["answer"] == "C"
          assert "乏尿は誤答" not in q317["explanation"]
          assert "Cが正答" in q317["explanation"]

          print("PASS: 712 questions / IDs / answers / explanations / canonical digest")
          PY

          python3 -m http.server 8765 --directory dist >/tmp/v166-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/app.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/sw.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/data.part01 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/DATASET_VERSION.txt
          kill $server_pid
          trap - EXIT

          echo "PREDEPLOY_V166_PASS"

      - name: Upload staged build for audit only
        uses: actions/upload-artifact@v4
        with:
          name: common-subject-712-v166-predeploy
          path: dist
          retention-days: 7
