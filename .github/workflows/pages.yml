name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          test -f site.zip
          unzip -q site.zip -d dist
          test -f dist/index.html
          test -f dist/sw.js
          cp display-patch.js dist/display-patch.js
          cp display-patch.css dist/display-patch.css
          sed -i '/<\/head>/i\  <link rel="stylesheet" href="./display-patch.css?v=1">' dist/index.html
          sed -i '/<\/body>/i\  <script src="./display-patch.js?v=1"></script>' dist/index.html
          sed -i "s/const CACHE='common-subject-709-v1-2';/const CACHE='common-subject-709-v1-3';/" dist/sw.js
          sed -i "s#'./data.part04'#'./data.part04','./display-patch.js','./display-patch.css'#" dist/sw.js
          grep -q 'display-patch.js' dist/index.html
          grep -q 'display-patch.css' dist/index.html
          grep -q 'common-subject-709-v1-3' dist/sw.js
          grep -q "'./display-patch.js'" dist/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
